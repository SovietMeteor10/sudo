name: Deploy sudo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            echo "== entering app directory =="
            cd /home/anthony/apps/sudo

            echo "== syncing latest main =="
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "== installing dependencies =="
            npm ci

            echo "== building =="
            npm run build

            echo "== restarting service =="
            sudo /usr/bin/systemctl restart sudo.service

            echo "== service is active =="
            /usr/bin/systemctl is-active --quiet sudo.service

            echo "== local health check =="
            curl -fsS http://127.0.0.1:3000 >/dev/null

            echo "== public health check =="
            curl -fsS https://sudochat.xyz >/dev/null

            echo "== deploy complete =="
